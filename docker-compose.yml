services:
  postgres:
    image: postgres:18-alpine
    container_name: retailhub-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Fallbacks if not present in backend/.env
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-retailhub_db}
    ports:
      - "5433:5432"
    volumes:
      - retailhub_pgdata:/var/lib/postgresql 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: retailhub-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - retailhub_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  retailhub_pgdata:
    name: retailhub_pgdata
  retailhub_redisdata:
    name: retailhub_redisdata
